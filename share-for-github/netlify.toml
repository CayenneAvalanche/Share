# Share — Netlify → share.myendeavors.me
#
# Required env (Site configuration → Environment variables):
#   DATABASE_URL   = Neon pooled postgres://… connection string
# Optional:
#   FOUNDER_PIN    = admin inbox PIN (default: lafayette1) — change in Netlify UI
#   VITE_APP_MODE  = demo | beta  (default: beta on prod host, demo on demo.*)
#   STRIPE_SECRET_KEY / STRIPE_PUBLISHABLE_KEY = later for real payments
#
# Dual tour:
#   share.myendeavors.me     → public beta (empty marketplace, real Neon apps)
#   demo.share.myendeavors.me → set VITE_APP_MODE=demo on a second site, or use
#   hostname starting with demo. (client detects demo.* as demo mode)

[build]
  command = "npm run build"
  publish = "dist"
  functions = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
