# Share — Netlify → share.myendeavors.me
#
# Required env (Site configuration → Environment variables):
#   DATABASE_URL   = Neon connection string (Site UI only — never commit)
#   FOUNDER_PIN    = admin inbox PIN (Site UI only — never put the real value in git)
# Optional:
#   VITE_APP_MODE  = demo | beta
#   STRIPE_SECRET_KEY / STRIPE_PUBLISHABLE_KEY = payments later
#
# Domains:
#   share.myendeavors.me      → public beta (empty marketplace)
#   demo.share.myendeavors.me → demo mode (hostname starts with demo.)
#
# To wire demo.share (DNS + Netlify):
#   1. Netlify → Domain management → Add domain alias: demo.share.myendeavors.me
#   2. DNS at registrar (Hover/etc) for myendeavors.me:
#        Type CNAME | Host: demo.share | Value: share337.netlify.app
#        (or the target Netlify shows for that domain)
#   Until DNS propagates, use sticky demo mode:
#        https://share.myendeavors.me/app?mode=demo

[build]
  command = "npm run build"
  publish = "dist"
  functions = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "22"
  # DATABASE_URL is used by server functions at runtime; omit from scan so
  # Netlify does not fail the build when server bundles reference the env key.
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL,FOUNDER_PIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
